name: Publish npm Packages

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  resolve-publish-context:
    name: Resolve publish context
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      dev_build_ref: ${{ steps.context.outputs.dev_build_ref }}
      dev_version: ${{ steps.context.outputs.dev_version }}
      release_build_ref: ${{ steps.context.outputs.release_build_ref }}
      release_version: ${{ steps.context.outputs.release_version }}
      should_publish_release: ${{ steps.context.outputs.should_publish_release }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve version and tags
        id: context
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          read_version() {
            python3 -c 'import subprocess, sys, xml.etree.ElementTree as ET; target=sys.argv[1]; text=open("version.props", encoding="utf-8").read() if target == "WORKTREE" else subprocess.check_output(["git", "show", f"{target}:version.props"], text=True); version=(ET.fromstring(text).findtext(".//Version") or "").strip(); print(version) if version else sys.exit("version.props does not contain a <Version> value")' "$1"
          }

          create_tag_if_needed() {
            local commit="$1"
            local version="$2"
            local tag="v${version}"

            if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
              local existing_commit
              existing_commit=$(git rev-list -n 1 "${tag}")
              if [[ "${existing_commit}" == "${commit}" ]]; then
                echo "${tag} already points to ${commit}."
                return
              fi

              echo "${tag} already exists on ${existing_commit}; refusing to reuse version ${version}." >&2
              exit 1
            fi

            git tag "${tag}" "${commit}"
            git push origin "refs/tags/${tag}"
            echo "Created ${tag} for ${commit}."
          }

          dev_build_ref="${SHA}"
          dev_version="0.0.0-dev.${SHA::12}"
          release_build_ref=""
          release_version=""
          should_publish_release="false"

          current_version=$(read_version WORKTREE)
          current_tag="v${current_version}"

          if [[ "${REF_TYPE}" == "tag" ]]; then
            release_build_ref="${SHA}"
            release_version="${current_version}"
            if [[ "${REF_NAME}" != "${current_tag}" ]]; then
              echo "Tag ${REF_NAME} does not match version.props (${current_version})." >&2
              exit 1
            fi

            should_publish_release="true"
          elif ! git rev-parse -q --verify "refs/tags/${current_tag}" >/dev/null; then
            release_build_ref="${SHA}"
            release_version="${current_version}"
            create_tag_if_needed "${SHA}" "${release_version}"
            should_publish_release="true"
          fi

          echo "dev_build_ref=${dev_build_ref}" >> "${GITHUB_OUTPUT}"
          echo "dev_version=${dev_version}" >> "${GITHUB_OUTPUT}"
          echo "release_build_ref=${release_build_ref}" >> "${GITHUB_OUTPUT}"
          echo "release_version=${release_version}" >> "${GITHUB_OUTPUT}"
          echo "should_publish_release=${should_publish_release}" >> "${GITHUB_OUTPUT}"

  prepare-release:
    name: Prepare GitHub release
    if: needs.resolve-publish-context.outputs.should_publish_release == 'true'
    runs-on: ubuntu-latest
    needs: resolve-publish-context
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: v${{ needs.resolve-publish-context.outputs.release_version }}

    steps:
      - name: Ensure GitHub release exists
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "GitHub release already exists for $RELEASE_TAG."
          else
            gh release create "$RELEASE_TAG" --title "$RELEASE_TAG" --generate-notes
          fi

  publish-dev-platform-package:
    name: Publish dev Windows package
    if: github.ref_type != 'tag'
    runs-on: windows-latest
    needs: resolve-publish-context
    concurrency:
      group: npm-publish-win32-x64
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ needs.resolve-publish-context.outputs.dev_build_ref }}

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.x

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 26.13.0
          registry-url: https://registry.npmjs.org

      - name: Build and publish platform package
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ needs.resolve-publish-context.outputs.dev_version }}
        run: |
          set -euo pipefail

          dotnet restore src/OpencodeWrap.csproj -r win-x64
          dotnet publish src/OpencodeWrap.csproj -c Release -r win-x64 --self-contained true -p:PublishAot=true -p:PublishSingleFile=true -p:PublishTrimmed=true

          mkdir -p npm/ocw-win32-x64/bin
          cp src/bin/Release/net11.0-windows/win-x64/publish/ocw.exe npm/ocw-win32-x64/bin/ocw.exe

          npm version "$VERSION" --no-git-tag-version --prefix npm/ocw-win32-x64

          PACKAGE_NAME=$(node -p "require('./npm/ocw-win32-x64/package.json').name")
          if npm view --prefer-online "${PACKAGE_NAME}@${VERSION}" version >/dev/null 2>&1; then
            echo "Skipping ${PACKAGE_NAME}@${VERSION}, already published."
            exit 0
          fi

          bash .github/scripts/publish-npm-with-retry.sh npm/ocw-win32-x64 "${PACKAGE_NAME}" "${VERSION}" dev

  publish-dev-main-package:
    name: Publish dev main package
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    needs:
      - resolve-publish-context
      - publish-dev-platform-package
    concurrency:
      group: npm-publish-main
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.resolve-publish-context.outputs.dev_version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ needs.resolve-publish-context.outputs.dev_build_ref }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 26.13.0
          registry-url: https://registry.npmjs.org

      - name: Prepare and publish main package
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail

          chmod +x npm/ocw/bin/ocw.js
          npm version "$VERSION" --no-git-tag-version --prefix npm/ocw

          export VERSION
          node -e 'const fs=require("node:fs"); const p="npm/ocw/package.json"; const version=process.env.VERSION; const pkg=JSON.parse(fs.readFileSync(p, "utf8")); pkg.optionalDependencies["@farsight-cda/ocw-win32-x64"]=version; fs.writeFileSync(p, JSON.stringify(pkg, null, 2)+"\n");'

          PACKAGE_NAME=$(node -p "require('./npm/ocw/package.json').name")
          if npm view --prefer-online "${PACKAGE_NAME}@${VERSION}" version >/dev/null 2>&1; then
            echo "Skipping ${PACKAGE_NAME}@${VERSION}, already published."
            exit 0
          fi

          bash .github/scripts/publish-npm-with-retry.sh npm/ocw "${PACKAGE_NAME}" "${VERSION}" dev

  publish-release-platform-package:
    name: Publish release Windows package
    if: needs.resolve-publish-context.outputs.should_publish_release == 'true'
    runs-on: windows-latest
    needs:
      - resolve-publish-context
      - prepare-release
    concurrency:
      group: npm-publish-win32-x64
      cancel-in-progress: false
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ needs.resolve-publish-context.outputs.release_build_ref }}

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.x

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 26.13.0
          registry-url: https://registry.npmjs.org

      - name: Build, publish package, and upload release asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          RELEASE_TAG: v${{ needs.resolve-publish-context.outputs.release_version }}
          VERSION: ${{ needs.resolve-publish-context.outputs.release_version }}
        run: |
          set -euo pipefail

          dotnet restore src/OpencodeWrap.csproj -r win-x64
          dotnet publish src/OpencodeWrap.csproj -c Release -r win-x64 --self-contained true -p:PublishAot=true -p:PublishSingleFile=true -p:PublishTrimmed=true

          mkdir -p npm/ocw-win32-x64/bin release-assets
          cp src/bin/Release/net11.0-windows/win-x64/publish/ocw.exe npm/ocw-win32-x64/bin/ocw.exe
          cp src/bin/Release/net11.0-windows/win-x64/publish/ocw.exe release-assets/ocw-win-x64.exe

          npm version "$VERSION" --no-git-tag-version --prefix npm/ocw-win32-x64

          PACKAGE_NAME=$(node -p "require('./npm/ocw-win32-x64/package.json').name")
          if npm view --prefer-online "${PACKAGE_NAME}@${VERSION}" version >/dev/null 2>&1; then
            echo "Skipping ${PACKAGE_NAME}@${VERSION}, already published."
          else
            bash .github/scripts/publish-npm-with-retry.sh npm/ocw-win32-x64 "${PACKAGE_NAME}" "${VERSION}" latest
          fi

          gh release upload "$RELEASE_TAG" release-assets/ocw-win-x64.exe --clobber

  publish-release-main-package:
    name: Publish release main package
    if: needs.resolve-publish-context.outputs.should_publish_release == 'true'
    runs-on: ubuntu-latest
    needs:
      - resolve-publish-context
      - publish-release-platform-package
    concurrency:
      group: npm-publish-main
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.resolve-publish-context.outputs.release_version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ needs.resolve-publish-context.outputs.release_build_ref }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 26.13.0
          registry-url: https://registry.npmjs.org

      - name: Prepare and publish main package
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail

          chmod +x npm/ocw/bin/ocw.js
          npm version "$VERSION" --no-git-tag-version --prefix npm/ocw

          export VERSION
          node -e 'const fs=require("node:fs"); const p="npm/ocw/package.json"; const version=process.env.VERSION; const pkg=JSON.parse(fs.readFileSync(p, "utf8")); pkg.optionalDependencies["@farsight-cda/ocw-win32-x64"]=version; fs.writeFileSync(p, JSON.stringify(pkg, null, 2)+"\n");'

          PACKAGE_NAME=$(node -p "require('./npm/ocw/package.json').name")
          if npm view --prefer-online "${PACKAGE_NAME}@${VERSION}" version >/dev/null 2>&1; then
            echo "Skipping ${PACKAGE_NAME}@${VERSION}, already published."
            exit 0
          fi

          bash .github/scripts/publish-npm-with-retry.sh npm/ocw "${PACKAGE_NAME}" "${VERSION}" latest
